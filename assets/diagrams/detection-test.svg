<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
  <title id="t">Detection test per sensor, per cell</title>
  <desc id="d">A grid cell is detected by a sensor only if it passes three tests in order: range, field of view, line of sight. The coverage count is the number of sensors whose tests all pass; zero is a dead zone.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow  { stroke-dasharray: 6 6; animation: flow 3s linear infinite; }
    .deadchip { animation: pulse 6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -48 } }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <rect width="1200" height="480" fill="#F5F7FA"/>
  <text x="48" y="52" class="mono" font-size="12" letter-spacing="1.2" fill="#5F6B7C">FIG. 1  ·  DETECTION TEST, REPEATED FOR EVERY SENSOR AND EVERY GRID CELL</text>
  <text x="48" y="94" class="display" font-size="26" font-weight="600" fill="#0E1726">A cell counts as covered only if it passes all three tests</text>

  <!-- flow line -->
  <path class="flow" d="M228,230 L1110,230 L1110,356" fill="none" stroke="#3E5C76" stroke-width="1.75"/>

  <!-- input -->
  <rect x="48" y="170" width="180" height="120" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="68" y="202" class="mono" font-size="12" letter-spacing="1" fill="#5F6B7C">GRID CELL</text>
  <text x="68" y="266" class="sans" font-size="15" fill="#0E1726">centre (x, y)</text>

  <!-- gates -->
  <g>
    <rect x="288" y="170" width="220" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="288" y="170" width="220" height="3" fill="#0B2545"/>
    <text x="308" y="202" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">01  RANGE</text>
    <text x="308" y="266" class="sans" font-size="15" fill="#0E1726">min ≤ distance ≤ max</text>
    <circle cx="478" cy="198" r="11" fill="none" stroke="#3E5C76" stroke-width="1.75"/>
    <circle cx="478" cy="198" r="4" fill="none" stroke="#3E5C76" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="568" y="170" width="220" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="568" y="170" width="220" height="3" fill="#0B2545"/>
    <text x="588" y="202" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">02  FIELD OF VIEW</text>
    <text x="588" y="266" class="sans" font-size="15" fill="#0E1726">|bearing − centre| ≤ width / 2</text>
    <path d="M756,208 L744,188 A22,22 0 0,1 768,188 Z" fill="none" stroke="#3E5C76" stroke-width="1.75" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="848" y="170" width="220" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="848" y="170" width="220" height="3" fill="#0B2545"/>
    <text x="868" y="202" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">03  LINE OF SIGHT</text>
    <text x="868" y="266" class="sans" font-size="14" fill="#0E1726">no obstacle blocks the sightline</text>
    <line x1="1026" y1="206" x2="1050" y2="186" stroke="#3E5C76" stroke-width="1.75"/>
    <rect x="1034" y="190" width="8" height="8" fill="#3D4A5C"/>
  </g>

  <!-- fail stubs -->
  <g class="mono" font-size="12" fill="#5F6B7C">
    <line x1="398" y1="290" x2="398" y2="318" stroke="#D8DEE6" stroke-width="1.5"/>
    <text x="408" y="316">fail: not detected</text>
    <line x1="678" y1="290" x2="678" y2="318" stroke="#D8DEE6" stroke-width="1.5"/>
    <text x="688" y="316">fail: not detected</text>
    <line x1="958" y1="290" x2="958" y2="318" stroke="#8A6A1F" stroke-width="1.5" stroke-opacity=".6"/>
    <text x="968" y="316" fill="#8A6A1F">fail: in a shadow</text>
  </g>

  <!-- count row -->
  <rect x="288" y="356" width="864" height="84" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="308" y="388" class="mono" font-size="12" letter-spacing="1" fill="#5F6B7C">COVERAGE COUNT</text>
  <text x="308" y="418" class="sans" font-size="15" fill="#0E1726">number of sensors whose three tests pass</text>
  <g class="mono" font-size="13">
    <rect class="deadchip" x="730" y="378" width="128" height="40" rx="4" fill="#F4EFE2" stroke="#8A6A1F" stroke-width="1.5"/>
    <text x="746" y="403" fill="#8A6A1F">0  DEAD ZONE</text>
    <rect x="872" y="378" width="120" height="40" rx="4" fill="#EEF2F5" stroke="#3E5C76" stroke-width="1.5"/>
    <text x="890" y="403" fill="#0E1726">1  SINGLE</text>
    <rect x="1006" y="378" width="128" height="40" rx="4" fill="#EDF1F6" stroke="#0B2545" stroke-width="1.5"/>
    <text x="1020" y="403" fill="#0B2545">≥2  LAYERED</text>
  </g>

  <!-- travelling cells -->
  <circle r="6" fill="#0B2545" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="6s" repeatCount="indefinite" path="M228,230 L1110,230 L1110,356"/>
  </circle>
  <circle r="6" fill="#8A6A1F" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="6s" repeatCount="indefinite" path="M228,230 L958,230 L958,318" keyPoints="0;0;1;1" keyTimes="0;0.15;0.97;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.14;0.15;0.95;0.99;1"/>
  </circle>
</svg>
